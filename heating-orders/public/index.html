<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otopleniya buyurtma</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2b; --panel2:#16223a; --border:#223151;
    --text:#eaf0fb; --muted:#8ea0c2; --accent:#22c55e; --accent2:#16a34a; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 14px}
  header h1{font-size:16px;margin:0 0 2px}
  header .sub{font-size:12px;color:var(--muted)}
  .search{margin:10px 14px 0;position:relative}
  .search input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px}
  .cats{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat-chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:13px;white-space:nowrap;cursor:pointer}
  .cat-chip.active{background:var(--accent);border-color:var(--accent);color:#04220f;font-weight:600}
  .list{padding:6px 14px 14px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px}
  .card .name{font-size:14px;font-weight:600;margin-bottom:2px}
  .card .art{font-size:11px;color:var(--muted);margin-bottom:6px}
  .card .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .price{color:var(--accent);font-weight:700;font-size:14px}
  .unit{color:var(--muted);font-size:12px;font-weight:400}
  .qty{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:4px}
  .qty button{width:28px;height:28px;border:none;border-radius:8px;background:transparent;color:var(--text);font-size:16px;cursor:pointer}
  .qty button:active{background:var(--border)}
  .qty span{min-width:26px;text-align:center;font-size:14px}
  .add-btn{background:var(--accent);color:#04220f;border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
  .bar .info{flex:1}
  .bar .total{font-weight:700;font-size:15px}
  .bar .count{color:var(--muted);font-size:12px}
  .bar button{background:var(--accent);color:#04220f;border:none;border-radius:12px;padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer}
  .bar button:disabled{opacity:.4}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1c2a45;border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:88vw;text-align:center}
  .overlay{position:fixed;inset:0;background:rgba(4,8,16,.7);z-index:40;display:flex;align-items:flex-end}
  .sheet{background:var(--panel);border-radius:18px 18px 0 0;width:100%;max-height:80vh;overflow:auto;padding:16px}
  .sheet h2{margin:0 0 12px;font-size:16px}
  .srow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px}
  .srow .n{font-size:13px}
  .srow .a{font-size:11px;color:var(--muted)}
  .srow .s{font-weight:700;color:var(--accent);font-size:13px}
  .close-sheet{display:block;margin:14px auto 0;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 18px;font-size:13px}
  .success{padding:60px 20px;text-align:center}
  .success .ic{font-size:52px;margin-bottom:14px}
  .success h2{margin:0 0 8px}
  .success p{color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header>
  <h1 id="brigadeName">Otopleniya katalogi</h1>
  <div class="sub" id="subTitle">Tovarlarni tanlang va savatga qo‘shing</div>
</header>

<div class="search"><input id="searchInput" placeholder="Tovar qidirish (nomi yoki artikul)..."></div>
<div class="cats" id="cats"></div>
<div class="list" id="list"><div class="empty">Yuklanmoqda...</div></div>

<div class="bar">
  <div class="info">
    <div class="total" id="totalTxt">0 so‘m</div>
    <div class="count" id="countTxt">Savat bo‘sh</div>
  </div>
  <button id="cartBtn">🧺 Savat</button>
  <button id="orderBtn" disabled>Buyurtma berish</button>
</div>

<script>
// TODO: deploy qilingandan so'ng shu ikkalasini o'zingiznikiga almashtiring
window.CONFIG = {
  SUPABASE_URL: 'https://YOUR-PROJECT.supabase.co',
  SUPABASE_ANON_KEY: 'YOUR-ANON-KEY'
};
</script>
<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const params = new URLSearchParams(location.search);
  const code = params.get('g') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';

  const sb = window.supabase.createClient(window.CONFIG.SUPABASE_URL, window.CONFIG.SUPABASE_ANON_KEY);

  let products = [];
  let cart = {}; // id -> qty
  let activeCat = 'Barchasi';

  const fmt = n => Math.round(n).toLocaleString('ru-RU') + " so'm";

  function toast(msg){
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2600);
  }

  async function loadBrigade(){
    if (!code) {
      document.getElementById('subTitle').textContent = 'Havola noto‘g‘ri — guruhda /register orqali olingan tugmadan foydalaning';
      return;
    }
    try{
      const res = await fetch('/api/brigade?code=' + encodeURIComponent(code));
      const data = await res.json();
      if (data.nomi) {
        document.getElementById('brigadeName').textContent = data.nomi;
        document.getElementById('subTitle').textContent = 'Tovarlarni tanlang va savatga qo‘shing';
      } else {
        document.getElementById('subTitle').textContent = 'Brigada topilmadi';
      }
    }catch(e){ /* jim */ }
  }

  async function loadProducts(){
    const { data, error } = await sb.from('hs_products').select('*').eq('faol', true).order('kategoriya').order('nomi');
    if (error) { document.getElementById('list').innerHTML = '<div class="empty">Tovarlarni yuklab bo‘lmadi</div>'; return; }
    products = data || [];
    renderCats();
    render();
  }

  function renderCats(){
    const cats = ['Barchasi', ...new Set(products.map(p=>p.kategoriya || 'Boshqa'))];
    document.getElementById('cats').innerHTML = cats.map(c =>
      `<div class="cat-chip ${c===activeCat?'active':''}" data-c="${c}">${c}</div>`
    ).join('');
    document.querySelectorAll('.cat-chip').forEach(el=>{
      el.onclick = () => { activeCat = el.dataset.c; renderCats(); render(); };
    });
  }

  function render(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let items = products.filter(p => activeCat==='Barchasi' || (p.kategoriya||'Boshqa')===activeCat);
    if (q) items = items.filter(p => (p.nomi||'').toLowerCase().includes(q) || (p.artikul||'').toLowerCase().includes(q));

    const list = document.getElementById('list');
    if (!items.length) { list.innerHTML = '<div class="empty">Tovar topilmadi</div>'; return; }

    list.innerHTML = items.map(p => {
      const qty = cart[p.id] || 0;
      return `<div class="card" data-id="${p.id}">
        <div class="name">${p.nomi}</div>
        <div class="art">${p.artikul ? 'Artikul: '+p.artikul : ''}</div>
        <div class="row">
          <div class="price">${fmt(p.narx)} <span class="unit">/ ${p.birlik||'dona'}</span></div>
          ${qty>0
            ? `<div class="qty"><button data-act="dec">−</button><span>${qty}</span><button data-act="inc">+</button></div>`
            : `<button class="add-btn" data-act="add">+ Qo‘shish</button>`}
        </div>
      </div>`;
    }).join('');

    list.querySelectorAll('.card').forEach(card => {
      const id = card.dataset.id;
      card.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => {
          const act = btn.dataset.act;
          if (act === 'add' || act === 'inc') cart[id] = (cart[id]||0) + 1;
          else if (act === 'dec') { cart[id] = (cart[id]||0) - 1; if (cart[id]<=0) delete cart[id]; }
          render();
          updateBar();
        };
      });
    });
  }

  function updateBar(){
    const ids = Object.keys(cart);
    const total = ids.reduce((s,id) => {
      const p = products.find(x=>x.id===id);
      return s + (p ? p.narx * cart[id] : 0);
    }, 0);
    const count = ids.reduce((s,id)=>s+cart[id],0);
    document.getElementById('totalTxt').textContent = fmt(total);
    document.getElementById('countTxt').textContent = count ? (count + ' ta tovar') : 'Savat bo‘sh';
    document.getElementById('orderBtn').disabled = count === 0;
  }

  document.getElementById('searchInput').addEventListener('input', render);

  document.getElementById('cartBtn').onclick = () => {
    const ids = Object.keys(cart);
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    if (!ids.length) {
      overlay.innerHTML = `<div class="sheet"><h2>Savat bo‘sh</h2><button class="close-sheet">Yopish</button></div>`;
    } else {
      const rows = ids.map(id => {
        const p = products.find(x=>x.id===id);
        if (!p) return '';
        return `<div class="srow"><div><div class="n">${p.nomi}</div><div class="a">${cart[id]} x ${fmt(p.narx)}</div></div><div class="s">${fmt(p.narx*cart[id])}</div></div>`;
      }).join('');
      overlay.innerHTML = `<div class="sheet"><h2>Savat</h2>${rows}<button class="close-sheet">Yopish</button></div>`;
    }
    overlay.onclick = (e) => { if (e.target === overlay || e.target.classList.contains('close-sheet')) overlay.remove(); };
    document.body.appendChild(overlay);
  };

  document.getElementById('orderBtn').onclick = async () => {
    if (!code) { toast('Havola noto‘g‘ri. Guruhda /register orqali olingan tugmadan foydalaning.'); return; }
    const initData = tg ? tg.initData : '';
    if (!initData) { toast('Ilovani Telegram ichida oching.'); return; }

    const items = Object.keys(cart).map(id => ({ id, miqdor: cart[id] }));
    const btn = document.getElementById('orderBtn');
    btn.disabled = true; btn.textContent = 'Yuborilmoqda...';

    try {
      const res = await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData, code, items })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'Xatolik yuz berdi');

      cart = {};
      document.body.innerHTML = `<div class="success">
        <div class="ic">✅</div>
        <h2>Buyurtma qabul qilindi!</h2>
        <p>${data.brigade} guruhiga Excel fayl yuborildi.<br>Jami: ${fmt(data.total)}</p>
      </div>`;
      if (tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
    } catch (e) {
      toast(e.message);
      btn.disabled = false; btn.textContent = 'Buyurtma berish';
    }
  };

  loadBrigade();
  loadProducts();
})();
</script>
</body>
</html>
