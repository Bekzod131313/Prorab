<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Otopleniya buyurtma</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f3; --panel:#ffffff; --panel2:#f1f4ee; --border:#e6eae2;
    --text:#0e1410; --muted:#6c7a72; --accent:#8fce2e; --accent-deep:#5f9c1a; --accent-ink:#12290a;
    --blue:#2f7de0; --blue-bg:#e9f1fd; --red:#e2483d; --red-bg:#fdeceb; --green-bg:#eaf7dd; --amber:#c98a12; --amber-bg:#fbf1de;
    --shadow:0 1px 3px rgba(16,21,26,.06),0 10px 28px -12px rgba(16,21,26,.16);
    --tile1:#eaf7dd; --tile1-ink:#4c8a12; --tile2:#e6f0fb; --tile2-ink:#3467c9; --tile3:#fdeee0; --tile3-ink:#c26a1c;
    --tile4:#f3e8fb; --tile4-ink:#8846c4; --tile5:#fdeaee; --tile5-ink:#c53d63; --tile6:#e2f6f4; --tile6-ink:#188c81;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c130e; --panel:#131c15; --panel2:#182219; --border:#233028;
      --text:#eef3ea; --muted:#93a396; --accent:#9ee02f; --accent-deep:#7cc21e; --accent-ink:#0c2006;
      --blue:#5b9bee; --blue-bg:#132234; --red:#f2685e; --red-bg:#2c1613; --green-bg:#152614; --amber:#e0ac4b; --amber-bg:#2a2110;
      --shadow:0 1px 3px rgba(0,0,0,.35),0 10px 28px -12px rgba(0,0,0,.55);
      --tile1:#173420; --tile1-ink:#8ed860; --tile2:#152a3c; --tile2-ink:#7cabec; --tile3:#3a2513; --tile3-ink:#eba05a;
      --tile4:#2a1c38; --tile4-ink:#c79aeb; --tile5:#3a1720; --tile5-ink:#ec8ba3; --tile6:#12312d; --tile6-ink:#5fd9cb;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c130e; --panel:#131c15; --panel2:#182219; --border:#233028;
    --text:#eef3ea; --muted:#93a396; --accent:#9ee02f; --accent-deep:#7cc21e; --accent-ink:#0c2006;
    --blue:#5b9bee; --blue-bg:#132234; --red:#f2685e; --red-bg:#2c1613; --green-bg:#152614; --amber:#e0ac4b; --amber-bg:#2a2110;
    --shadow:0 1px 3px rgba(0,0,0,.35),0 10px 28px -12px rgba(0,0,0,.55);
    --tile1:#173420; --tile1-ink:#8ed860; --tile2:#152a3c; --tile2-ink:#7cabec; --tile3:#3a2513; --tile3-ink:#eba05a;
    --tile4:#2a1c38; --tile4-ink:#c79aeb; --tile5:#3a1720; --tile5-ink:#ec8ba3; --tile6:#12312d; --tile6-ink:#5fd9cb;
  }
  *{box-sizing:border-box}
  html,body{touch-action:manipulation}
  /* Ikonkalar uchun umumiy default o'lcham. Bularsiz o'lchami belgilanmagan
     har qanday yangi ikonka brauzerning standart (juda katta) o'lchamida
     chiziladi — shu sabab bir necha marta "kattaaa strelka" muammosi chiqdi.
     Klass bo'yicha yozilgan qoidalar (specificity yuqoriroq) buni bemalol
     o'zgartira oladi. */
  svg{width:16px;height:16px;flex:0 0 auto}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',-apple-system,sans-serif;padding-bottom:84px}
  #app{max-width:460px;margin:0 auto}

  :root{--tg-safe-top:50px; --tg-controls-h:40px; --tg-top-inset:calc(var(--tg-safe-top) + var(--tg-controls-h))}
  .topbar{display:flex;flex-direction:column;padding:max(8px, var(--tg-safe-top)) 60px 0;position:sticky;top:0;background:var(--bg);z-index:5}
  .logo{display:flex;flex-direction:column;line-height:1;cursor:pointer;align-items:center}
  .logo-img{height:18px;width:auto;display:block}
  .logo em{font-style:normal;font-size:7px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:4px;display:block}
  .topbar-icons{display:flex;gap:8px}
  .icon-btn{width:38px;height:38px;border-radius:11px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;flex:0 0 auto;position:relative}
  .icon-btn svg{width:18px;height:18px}
  .dot-badge{position:absolute;top:-5px;right:-5px;background:var(--accent);color:var(--accent-ink);font-size:9.5px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--bg)}

  /* max(): fullscreen bo'lmaganda --tg-controls-h = 0 bo'ladi va sarlavha
     logotipga yopishib qolardi — minimal bo'shliq shu tarzda kafolatlanadi. */
  .page-head{padding:max(14px, var(--tg-controls-h)) 18px 2px}
  .page-head h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;margin:0}
  .page-head p{font-size:12.5px;color:var(--muted);margin:3px 0 0}
  .page-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:max(14px, var(--tg-controls-h)) 18px 2px}
  .page-head-row .page-head{padding:0}
  .btn-accent{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .btn-accent svg{width:14px;height:14px}
  .btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .btn-ghost svg{width:14px;height:14px;flex:0 0 auto}
  .btn-ghost.danger{background:var(--red-bg);color:var(--red);border-color:var(--red-bg)}

  .search{padding:12px 18px 0;display:flex;gap:8px}
  .search.home-search{padding-top:max(14px, var(--tg-controls-h))}
  .search-box{flex:1;display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:0 13px;height:44px}
  .search-box svg{width:17px;height:17px;color:var(--muted);flex:0 0 auto}
  .search-box input{border:none;background:transparent;outline:none;color:var(--text);font-family:inherit;font-size:14px;width:100%}
  .search-box input::placeholder{color:var(--muted)}

  .photo{background:var(--tile1);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--tile1-ink);flex:0 0 auto}
  .photo svg{width:46%;height:46%}
  .photo.t2{background:var(--tile2);color:var(--tile2-ink)}
  .photo.t3{background:var(--tile3);color:var(--tile3-ink)}
  .photo.t4{background:var(--tile4);color:var(--tile4-ink)}
  .photo.t5{background:var(--tile5);color:var(--tile5-ink)}
  .photo.t6{background:var(--tile6);color:var(--tile6-ink)}

  .hero{margin:14px 18px 4px;border-radius:18px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);position:relative;overflow:hidden;padding:20px 20px 22px;color:var(--accent-ink)}
  .hero-img{display:block;width:100%;border-radius:18px;box-shadow:var(--shadow)}
  .hero::before{content:"";position:absolute;right:-28px;top:-36px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16)}
  .hero::after{content:"";position:absolute;right:16px;bottom:-22px;width:96px;height:96px;border:12px solid rgba(255,255,255,.18);border-radius:50%}
  .hero-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
  .hero h2{font-family:'Manrope',sans-serif;font-weight:800;font-size:19px;line-height:1.22;margin:6px 0 12px;max-width:74%;text-wrap:balance}
  .hero-cta{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
  .hero-cta .arrow{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--accent-deep);display:flex;align-items:center;justify-content:center}
  .hero-cta .arrow svg{width:12px;height:12px}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:22px 18px 12px}
  .sec-head h3{font-family:'Manrope',sans-serif;font-weight:800;font-size:16.5px;margin:0}
  .sec-head a{font-size:12.5px;font-weight:700;color:var(--accent-deep);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .sec-head a svg{width:13px;height:13px;flex:0 0 auto}

  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px 8px}
  .cat-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px;cursor:pointer;box-shadow:var(--shadow)}
  .cat-card .photo{width:100%;aspect-ratio:1;border-radius:11px}
  .cat-card .row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:8px}
  .cat-card .n{font-size:11.5px;font-weight:700;line-height:1.2}
  .cat-card .row svg{width:13px;height:13px;color:var(--muted);flex:0 0 auto}

  .plist-head{display:flex;align-items:center;gap:12px;padding:max(14px, calc(2px + var(--tg-top-inset))) 18px 4px}
  .back{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;color:var(--text)}
  .back svg{width:16px;height:16px}
  .plist-head h3{font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .plist{padding:10px 18px 16px;display:flex;flex-direction:column;gap:10px}
  .pcard{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);cursor:pointer}
  .pcard .photo{width:52px;height:52px}
  .pcard .info{flex:1;min-width:0}
  .pcard .name{font-size:13.5px;font-weight:700;line-height:1.25}
  .pcard .art{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .pcard .price{font-size:13.5px;font-weight:800;color:var(--accent-deep);margin-top:6px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
  .pcard .price s{color:var(--muted);font-weight:500;font-size:11px}
  .pcard .price small{color:var(--muted);font-weight:500;font-size:11px;white-space:nowrap;margin-left:5px}
  .pcard .price .now{white-space:nowrap}
  .pcard .price .off{font-style:normal;font-size:10.5px;font-weight:800;color:var(--red);background:var(--red-bg);border-radius:6px;padding:1px 5px;white-space:nowrap}
  .badge-mini{display:inline-block;background:var(--red-bg);color:var(--red);font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}

  .stepper{display:flex;align-items:center;gap:0;background:var(--panel2);border:1px solid var(--border);border-radius:10px;flex:0 0 auto}
  .stepper button{width:28px;height:28px;border:none;background:transparent;color:var(--text);font-size:16px;cursor:pointer;font-family:inherit}
  .stepper span{min-width:22px;text-align:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .stepper .qty-input{min-width:22px;width:28px;text-align:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;border:none;background:transparent;color:var(--text);font-family:inherit;padding:0}
  .stepper .qty-input::-webkit-outer-spin-button,.stepper .qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .add-pill{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;width:34px;height:34px;font-size:18px;font-weight:700;cursor:pointer;flex:0 0 auto}

  .filter-tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none}
  .filter-tabs::-webkit-scrollbar{display:none}
  .ftab{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer}
  .ftab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .order-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:13px;box-shadow:var(--shadow);cursor:pointer}
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .order-id{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px}
  .order-meta{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:4px}
  .order-meta svg{width:12px;height:12px;flex:0 0 auto}
  .pill{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .pill.green{background:var(--green-bg);color:var(--accent-deep)}
  .pill.blue{background:var(--blue-bg);color:var(--blue)}
  .pill.red{background:var(--red-bg);color:var(--red)}
  .pill.amber{background:var(--amber-bg);color:var(--amber)}
  .order-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .order-total{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .chev{width:15px;height:15px;color:var(--muted)}

  .cart-item{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
  .cart-item .photo{width:56px;height:56px}
  .cart-item .info{flex:1;min-width:0}
  .cart-item .name{font-size:13px;font-weight:700}
  .cart-item .art{font-size:10.5px;color:var(--muted);margin:2px 0 6px;font-variant-numeric:tabular-nums}
  .stock-badge{display:inline-block;background:var(--green-bg);color:var(--accent-deep);font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;margin-bottom:8px}
  .cart-item .bottom-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cart-item .trash{color:var(--red);cursor:pointer;width:32px;height:32px;margin:-6px -6px 0 0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .cart-item .trash svg{width:16px;height:16px}
  .price-block{text-align:right}
  .price-block .unit{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .price-block .line{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}

  .draft-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
  .draft-card .info{flex:1;min-width:0}
  .draft-card .n{font-size:12.5px;font-weight:700}
  .draft-card .a{font-size:10.5px;color:var(--muted);margin-top:2px}
  .draft-card .amt{font-size:12px;font-weight:800;white-space:nowrap}
  .draft-card .trash{color:var(--red);cursor:pointer;flex:0 0 auto}

  .field{margin:0 18px 12px}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input, .field textarea, .field select{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:14px;font-family:inherit;color:var(--text)}
  .field textarea{resize:vertical;min-height:70px}
  .obj-select{margin:14px 18px 0;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
  .obj-select .l{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .obj-select .l svg{width:13px;height:13px}
  .obj-select select{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;color:var(--text)}

  .summary{margin:14px 18px 0;background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:16px}
  .summary h4{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;margin:0 0 10px}
  .srow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:5px 0}
  .srow.total{border-top:1px solid var(--border);margin-top:6px;padding-top:11px;font-size:15px;font-weight:800;color:var(--text)}
  .srow.total b{font-variant-numeric:tabular-nums}
  .srow span:last-child{font-variant-numeric:tabular-nums}

  .cta-wrap{padding:16px 18px 0}
  .cta{width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:14px;padding:15px;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
  .cta:disabled{opacity:.4;cursor:not-allowed}
  .cta svg{width:16px;height:16px}
  .empty-state{padding:60px 24px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
  .empty-state svg{width:40px;height:40px;color:var(--border);margin-bottom:12px}
  .empty-state .btn-accent{margin:16px auto 0;display:inline-flex}
  .empty-state .btn-accent svg{width:15px;height:15px;color:inherit;margin:0}

  .obj-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;cursor:pointer}
  .obj-top{display:flex;gap:12px;align-items:center}
  .obj-top .photo{width:54px;height:54px}
  .obj-top .info{flex:1;min-width:0}
  .obj-top .name{font-size:14px;font-weight:700}
  .obj-top .loc{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:3px}
  .obj-top .loc svg{width:12px;height:12px;flex:0 0 auto}
  .obj-stats{display:flex;background:var(--panel2);border-radius:11px;overflow:hidden}
  .obj-stats .cell{flex:1;padding:9px 12px;text-align:left}
  .obj-stats .cell + .cell{border-left:1px solid var(--border)}
  .obj-stats .cell .l{font-size:10.5px;color:var(--muted)}
  .obj-stats .cell .v{font-size:13px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
  .obj-stats .cell .v.red{color:var(--red)}
  .obj-stats .cell .v.green{color:var(--accent-deep)}

  .loc-card{margin:12px 18px 0;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
  .loc-card .ic{width:36px;height:36px;border-radius:11px;background:var(--green-bg);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .loc-card .mid{flex:1;min-width:0}
  .loc-card .t{font-size:12.5px;font-weight:800}
  .loc-card .s{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .loc-card .btn-ghost{flex:0 0 auto;font-size:11.5px;padding:8px 11px}

  .obj-hero{margin:10px 18px 0;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .obj-hero-top{display:flex;align-items:center;gap:12px}
  .obj-hero-top .info{flex:1;min-width:0}
  .obj-hero-top .name{font-size:15px;font-weight:800;font-family:'Manrope',sans-serif}
  .obj-hero-top .loc{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:4px}
  .obj-hero-top .loc svg{width:12px;height:12px;flex:0 0 auto}

  .stat-rows{padding:4px 14px 14px}
  .stat-rows .srow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);padding:7px 0}
  .stat-rows .srow + .srow{border-top:1px solid var(--border)}
  .stat-rows .srow b{color:var(--text);font-size:13px}
  .pd-photo svg{width:64px;height:64px}

  function toast(msg){
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2800);
  }

  // ---------- API helper ----------
  async function api(path, opts={}){
    const headers = Object.assign({ 'Content-Type':'application/json', 'X-Telegram-Init-Data': tg ? tg.initData : '' }, opts.headers||{});
    const res = await fetch(path, Object.assign({}, opts, { headers }));
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data.error || (tr('toast_generic_error')+' '+res.status));
    return data;
  }

  // ---------- App state ----------
  const S = {
    booted: false, error: null,
    profile: null, brigade: null, objects: [],
    products: [], cart: {}, drafts: [], notifications: [],
    stack: [{ screen: 'asosiy' }],
    tmp: {} // screen-local scratch (search text, active category, active object subtab...)
  };

  function push(screen, params){ S.stack.push({ screen, params: params||{} }); render(); window.scrollTo(0,0); }
  function pop(){ if (S.stack.length>1) S.stack.pop(); render(); window.scrollTo(0,0); }
  function switchTab(screen){ S.stack = [{ screen, params:{} }]; render(); window.scrollTo(0,0); }
  function top(){ return S.stack[S.stack.length-1]; }

  function applyTheme(){
    const t = S.profile && S.profile.tema;
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    syncTelegramChrome(t);
  }

  // ---------- Savat: qoralama sifatida qurilmada saqlanadi ----------
  // Ilova yopilib qayta ochilganda ham savat bo'sh bo'lib qolmasligi uchun
  // (buyurtma hali berilmagan) tanlangan tovarlar shu foydalanuvchi+brigada
  // uchun localStorage'da saqlanadi.
  function cartStorageKey(){
    const tgId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 'anon';
    const brig = (S.brigade && S.brigade.code) || urlCode || 'x';
    return `zodpro_cart_${brig}_${tgId}`;
  }
  function saveCart(){
    try{ localStorage.setItem(cartStorageKey(), JSON.stringify(S.cart)); }catch(e){}
  }
  function loadCart(){
    try{
      const raw = localStorage.getItem(cartStorageKey());
      if (raw) S.cart = JSON.parse(raw) || {};
    }catch(e){}
  }
  function clearSavedCart(){
    try{ localStorage.removeItem(cartStorageKey()); }catch(e){}
  }

  // ---------- Qoralamalar: bir nechta savatni alohida-alohida saqlab qo'yish ----------
  // "Bitta buyurtma yig'ib qoralamaga tashladi, keyingisini yig'a boshladi" —
  // shuning uchun joriy savat va qoralamalar ro'yxati alohida saqlanadi.
  function draftsStorageKey(){
    const tgId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 'anon';
    const brig = (S.brigade && S.brigade.code) || urlCode || 'x';
    return `zodpro_drafts_${brig}_${tgId}`;
  }
  function saveDrafts(){
    try{ localStorage.setItem(draftsStorageKey(), JSON.stringify(S.drafts)); }catch(e){}
  }
  function loadDrafts(){
    try{
      const raw = localStorage.getItem(draftsStorageKey());
      S.drafts = raw ? (JSON.parse(raw) || []) : [];
    }catch(e){ S.drafts = []; }
  }
  function saveCurrentAsDraft(){
    if (!Object.keys(S.cart).length) return;
    S.drafts.unshift({ id: 'd'+Date.now(), created_at: new Date().toISOString(), cart: { ...S.cart } });
    S.cart = {};
    saveDrafts();
    toast(tr('toast_draft_saved'));
    render();
  }
  function resumeDraft(id){
    const idx = S.drafts.findIndex(d=>d.id===id);
    if (idx<0) return;
    const draft = S.drafts[idx];
    S.drafts.splice(idx, 1);
    if (Object.keys(S.cart).length){
      S.drafts.unshift({ id: 'd'+Date.now(), created_at: new Date().toISOString(), cart: { ...S.cart } });
    }
    S.cart = { ...draft.cart };
    saveDrafts();
    toast(tr('toast_draft_resumed'));
    render();
  }
  function deleteDraft(id){
    S.drafts = S.drafts.filter(d=>d.id!==id);
    saveDrafts();
    render();
  }

  // ================= SCREEN: Kirish (brigada login/parol) =================
  // Bitta login/parol butun guruh uchun: usta va shogirdlari o'z akkauntidan
  // kiradi, lekin buyurtma bir xil brigada nomidan va bir xil guruhga ketadi.
  function screenLogin(){
    const err = S.tmp.loginErr ? `<div class="login-err">${esc(S.tmp.loginErr)}</div>` : '';
    return `<div class="login-wrap">
      <img class="login-logo" src="${LOGO_URL}" alt="ZODPRO">
      <div class="login-tagline">${tr('logo_tagline')}</div>
      <div class="login-card">
        <h2>${tr('login_title')}</h2>
        <p>${tr('login_subtitle')}</p>
        ${err}
        <div class="field"><label>${tr('login_label')}</label>
          <input id="lg_login" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${tr('login_ph')}" value="${esc(S.tmp.loginVal)}"></div>
        <div class="field"><label>${tr('parol_label')}</label>
          <div class="pw-wrap">
            <input id="lg_parol" type="${S.tmp.showPw?'text':'password'}" placeholder="${tr('parol_ph')}" value="${esc(S.tmp.parolVal)}">
            <button type="button" class="pw-eye" data-toggle-pw>${S.tmp.showPw?tr('hide'):tr('show')}</button>
          </div>
        </div>
        <button class="cta" id="loginBtn" ${S.tmp.loginBusy?'disabled':''}>${S.tmp.loginBusy?tr('login_busy'):tr('login_btn')}</button>
      </div>
      <div class="login-hint">${ICONS.help}<div>${tr('login_hint')}</div></div>
    </div>`;
  }
  function wireLogin(){
    const lg = document.getElementById('lg_login');
    const pw = document.getElementById('lg_parol');
    const btn = document.getElementById('loginBtn');
    // Qayta render'da yozilgan matn yo'qolmasin
    if (lg) lg.oninput = e => { S.tmp.loginVal = e.target.value; };
    if (pw) pw.oninput = e => { S.tmp.parolVal = e.target.value; };
    if (pw) pw.onkeydown = e => { if (e.key === 'Enter') doLogin(); };
    if (lg) lg.onkeydown = e => { if (e.key === 'Enter' && pw) pw.focus(); };
    if (btn) btn.onclick = doLogin;
    const eye = document.querySelector('[data-toggle-pw]');
    if (eye) eye.onclick = () => { S.tmp.showPw = !S.tmp.showPw; render(); };
  }
  async function doLogin(){
    if (S.tmp.loginBusy) return;
    const login = (S.tmp.loginVal||'').trim();
    const parol = S.tmp.parolVal||'';
    if (!login || !parol) { S.tmp.loginErr = tr('login_empty'); render(); return; }
    S.tmp.loginBusy = true; S.tmp.loginErr = ''; render();
    try{
      const res = await api('/api/login', { method:'POST', body: JSON.stringify({ login, parol }) });
      S.profile = res.profile; S.brigade = res.brigade; S.objects = res.objects || [];
      S.tmp = {};
      applyTheme(); loadCart(); loadDrafts();
      S.stack = [{ screen:'asosiy', params:{} }];
      render();
      api('/api/notifications').then(n=>{ S.notifications = n; render(); }).catch(()=>{});
    } catch(e){
      S.tmp.loginErr = e.message;
    }
    S.tmp.loginBusy = false; render();
  }
  async function doLogout(){
    try{ await api('/api/logout', { method:'POST' }); } catch(e){}
    S.brigade = null; S.objects = []; S.cart = {}; S.drafts = []; S.notifications = [];
    S.tmp = {}; S.stack = [{ screen:'asosiy', params:{} }];
    render();
  }

  // ---------- Bootstrap ----------
  async function boot(){
    render(); // loading screen
    try{
      const [authRes, prodRes] = await Promise.all([
        api('/api/auth', { method:'POST', body: JSON.stringify({ code: urlCode }) }),
        sb.from('hs_products').select('*').eq('faol', true).order('kategoriya').order('nomi')
      ]);
      S.profile = authRes.profile; S.brigade = authRes.brigade; S.objects = authRes.objects || [];
      applyTheme();
      loadCart();
      loadDrafts();
      S.products = prodRes.data || [];
      S.booted = true;
      render();
      api('/api/notifications').then(n=>{ S.notifications = n; render(); }).catch(()=>{});
      return;
    } catch(e){
      S.error = e.message;
    }
    render();
  }

  // ================= SCREEN: Asosiy =================
  function screenAsosiy(){
    const q = (S.tmp.q||'').trim().toLowerCase();
    const unread = S.notifications.filter(n=>!n.oqilgan).length;
    const searchBox = `<div class="search home-search">

    </div>`;

    if (q){
      const results = S.products.filter(p => p.nomi.toLowerCase().includes(q) || (p.artikul||'').toLowerCase().includes(q));
      return `${renderTopbar()}${searchBox}
        <div class="sec-head"><h3>${tr('search_results')}</h3></div>
        <div class="plist">${results.length ? results.map(productCard).join('') : `<div class="empty-state">${tr('nothing_found')}</div>`}</div>`;
    }

    const cats = [...new Set(S.products.map(p=>p.kategoriya||'Boshqa'))];
    const aksiya = S.products.filter(p=>p.aksiya_narx!=null && p.aksiya_narx < p.narx).slice(0,6);
    const ommabop = S.products.filter(p=>p.ommabop).slice(0,6);
    const hero = `<div style="padding:14px 18px 4px"><img class="hero-img" src="${BANNER_URL}" alt="ZODPRO"></div>`;
    return `${renderTopbar()}${searchBox}${hero}
      ${!S.products.length ? `<div class="empty-state">${ICONS.box}<div>${tr('catalog_empty')}<br>${tr('catalog_empty_sub')}</div></div>` : ''}
      ${aksiya.length ? `<div class="sec-head"><h3>${tr('promotions')}</h3></div><div class="plist" data-plist="aksiya">${aksiya.map(productCard).join('')}</div>` : ''}
      ${ommabop.length ? `<div class="sec-head"><h3>${tr('popular_products')}</h3></div><div class="plist" data-plist="ommabop">${ommabop.map(productCard).join('')}</div>` : ''}
      <div class="sec-head"><h3>${tr('categories')}</h3><a data-open-cat="Barchasi">${tr('all')} ${ICONS.chev}</a></div>
      <div class="cat-grid">${cats.map(c=>`
        <div class="cat-card" data-open-cat="${c}">${photo(null, c)}<div class="row"><div class="n">${catLabel(c)}</div>${ICONS.chev}</div></div>
      `).join('')}</div>`;
  }

  function productCard(p){
    const qty = S.cart[p.id]||0;
    const hasDiscount = p.aksiya_narx!=null && p.aksiya_narx < p.narx;
    const price = hasDiscount ? p.aksiya_narx : p.narx;
    return `<div class="pcard" data-open-product="${p.id}">
      ${photo(null, p.kategoriya)}
      <div class="info">
        <div class="name">${esc(p.nomi)}${p.ommabop?'<span class="badge-mini">TOP</span>':''}</div>
        <div class="art">${tr('art_prefix')} ${esc(p.artikul)||'—'}</div>
        <div class="price">${hasDiscount?`<s>${fmtNum(p.narx)}</s><i class="off">−${Math.round((1-p.aksiya_narx/p.narx)*100)}%</i>`:''}<span class="now">${fmt(price)}<small>/ ${unitLabel(p.birlik)}</small></span></div>
      </div>
      <div data-stop>
        ${qty>0
          ? `<div class="stepper"><button data-cart-dec="${p.id}">−</button><input class="qty-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" id="qty-${p.id}" data-qty-input="${p.id}" value="${qty}"><button data-cart-inc="${p.id}">+</button></div>`
          : `<button class="add-pill" data-cart-add="${p.id}">+</button>`}
      </div>
    </div>`;
  }

  // ================= SCREEN: category product list =================
  function screenList(params){
    const cat = params.cat || 'Barchasi';
    const q = (S.tmp.listQ||'').toLowerCase();

  async function submitOrder(){
    const sel = document.getElementById('objSelect');
    const objectId = sel ? sel.value : (S.objects[0] && S.objects[0].id);
    if (!objectId) { toast(tr('toast_select_object_first')); return; }
    const items = Object.keys(S.cart).map(id=>({ id, miqdor: S.cart[id] }));
    const btn = document.getElementById('orderBtn');
    btn.disabled = true; btn.textContent = tr('sending');
    try{
      const res = await api('/api/order', { method:'POST', body: JSON.stringify({ code: S.brigade.code || urlCode, object_id: objectId, items }) });
      S.cart = {};
      clearSavedCart();
      S.tmp.orders = null; S.tmp.objectsList = null;
      renderSuccess(res);
    } catch(e){
      toast(e.message);
      btn.disabled = false; btn.textContent = tr('place_order');
    }
  }

    document.getElementById('app').innerHTML = `<div class="success">

      <p>${tr('success_nakladnoy')} <b>${esc(res.order_no)}</b><br>${tr('success_object')} ${esc(res.object)}<br>${tr('success_total')} ${fmt(res.total)} ${tr('success_debt_suffix')}<br>${tr('success_excel')} <b>${esc(res.brigade)}</b> ${tr('success_group_suffix')}</p>
      <button data-goto-orders>${tr('view_my_orders')}</button>
    </div>`;
    document.querySelector('[data-goto-orders]').onclick = () => { S.tmp.orders = null; switchTab('orders'); };
    renderNav();

    const sum = months.reduce((a,m)=>a+byMonth[m], 0);
    return `<div style="margin:12px 18px;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)">

  // ================= main render =================
  function render(){
    const app = document.getElementById('app');
    const active = document.activeElement;
    const focusId = active && active.id && (active.tagName==='INPUT'||active.tagName==='TEXTAREA') ? active.id : null;
    const selStart = focusId ? active.selectionStart : null;
    const selEnd = focusId ? active.selectionEnd : null;

    if (!S.booted && !S.error){ app.innerHTML = loadingRow(); document.getElementById('navbarInner').innerHTML=''; return; }
    if (S.error){ app.innerHTML = `<div class="loading-screen">⚠️ ${S.error}</div>`; return; }
    if (!S.brigade){
      app.innerHTML = screenLogin();
      document.getElementById('navbarInner').innerHTML='';
      wireLogin();
      return;
    }
    saveCart();
    const t = top();
    let html = '';
    if (t.screen==='asosiy') html = screenAsosiy();
    else if (t.screen==='list') html = screenList(t.params);
    else if (t.screen==='product') html = screenProduct(t.params);
    else if (t.screen==='orders') html = screenOrders();
    else if (t.screen==='order-detail') html = screenOrderDetail(t.params);
    else if (t.screen==='cart') html = screenCart();
    else if (t.screen==='objects') html = screenObjects();
    else if (t.screen==='new-object') html = screenNewObject();
    else if (t.screen==='object-detail') html = screenObjectDetail(t.params);
    else if (t.screen==='profile') html = screenProfile();
    else if (t.screen==='profile-edit') html = screenProfileEdit();
    else if (t.screen==='addresses') html = screenAddresses();
    else if (t.screen==='help') html = screenHelp();
    else if (t.screen==='operator') html = screenOperator();
    else if (t.screen==='notifications') html = screenNotifications();
    app.innerHTML = html;
    renderNav();
    wire();

    if (focusId){
      const el = document.getElementById(focusId);
      if (el){ el.focus(); try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }

  // ================= event wiring (delegated, re-bound each render) =================
  function wire(){
    const app = document.getElementById('app');
    app.querySelectorAll('[data-nav-home]').forEach(el=>el.onclick=()=>switchTab('asosiy'));
    app.querySelectorAll('[data-goto-tab]').forEach(el=>el.onclick=()=>switchTab(el.dataset.gotoTab));
    app.querySelectorAll('[data-logout]').forEach(el=>el.onclick=()=>{ if (confirm(tr('logout_confirm'))) doLogout(); });
    // Faol subtab ekrandan chiqib ketmasin — gorizontal ro'yxatni suramiz
    const activeSub = app.querySelector('.subtab.active');
    if (activeSub && activeSub.parentElement) {
      const box = activeSub.parentElement;
      box.scrollLeft = Math.max(0, activeSub.offsetLeft - box.clientWidth / 2 + activeSub.offsetWidth / 2);
    }
    app.querySelectorAll('[data-open-notif]').forEach(el=>el.onclick=()=>push('notifications'));
    app.querySelectorAll('[data-pop]').forEach(el=>el.onclick=pop);
    app.querySelectorAll('[data-open-cat]').forEach(el=>el.onclick=()=>{ S.tmp.listQ=''; push('list', { cat: el.dataset.openCat }); });
    app.querySelectorAll('[data-set-cat]').forEach(el=>el.onclick=()=>{ top().params.cat = el.dataset.setCat; render(); });
    app.querySelectorAll('[data-open-product]').forEach(el=>el.onclick=(e)=>{ if(e.target.closest('[data-stop]')) return; push('product', { id: el.dataset.openProduct }); });
    app.querySelectorAll('[data-open-order]').forEach(el=>el.onclick=()=>{ S.tmp.orderDetail=null; push('order-detail', { id: el.dataset.openOrder }); });
    app.querySelectorAll('[data-open-object]').forEach(el=>el.onclick=()=>{ S.tmp.objDetail=null; S.tmp.objTab='dashboard'; push('object-detail', { id: el.dataset.openObject }); });
    app.querySelectorAll('[data-obj-tab]').forEach(el=>el.onclick=()=>{ S.tmp.objTab = el.dataset.objTab; render(); });
    app.querySelectorAll('[data-new-order-for]').forEach(el=>el.onclick=()=>{ S.tmp.selectedObj = el.dataset.newOrderFor; switchTab('asosiy'); });
    app.querySelectorAll('[data-send-location]').forEach(el=>el.onclick=async()=>{
      try{ await api('/api/send-object-location?id='+el.dataset.sendLocation); toast(tr('toast_location_sent')); } catch(e){ toast(e.message); }
    });
    app.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{ if(el.dataset.goto==='addresses') S.tmp.addresses=null; push(el.dataset.goto); });
    app.querySelectorAll('[data-goto-profile-edit]').forEach(el=>el.onclick=()=>push('profile-edit'));
    app.querySelectorAll('[data-goto-new-object]').forEach(el=>el.onclick=()=>push('new-object'));

    app.querySelectorAll('[data-cart-add]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); S.cart[el.dataset.cartAdd]=(S.cart[el.dataset.cartAdd]||0)+1; render(); });
    app.querySelectorAll('[data-cart-inc]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); S.cart[el.dataset.cartInc]=(S.cart[el.dataset.cartInc]||0)+1; render(); });
    app.querySelectorAll('[data-cart-dec]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); const id=el.dataset.cartDec; S.cart[id]--; if(S.cart[id]<=0) delete S.cart[id]; render(); });
    app.querySelectorAll('[data-cart-del]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); delete S.cart[el.dataset.cartDel]; render(); });
    app.querySelectorAll('[data-qty-input]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); };
      const commit = ()=>{
        const id = el.dataset.qtyInput;
        const n = parseInt(el.value, 10);
        if (!n || n<=0) delete S.cart[id]; else S.cart[id] = n;
        render();
      };
      el.onchange = commit;
      el.onkeydown = (e)=>{ if (e.key==='Enter') el.blur(); };
    });
    const clearCart = app.querySelector('[data-clear-cart]'); if (clearCart) clearCart.onclick=()=>{ S.cart={}; render(); };
    const saveDraftBtn = app.querySelector('[data-save-draft]'); if (saveDraftBtn) saveDraftBtn.onclick = saveCurrentAsDraft;
    app.querySelectorAll('[data-resume-draft]').forEach(el=>el.onclick=()=>resumeDraft(el.dataset.resumeDraft));
    app.querySelectorAll('[data-del-draft]').forEach(el=>el.onclick=()=>deleteDraft(el.dataset.delDraft));

    const homeSearch = document.getElementById('homeSearch'); if (homeSearch) homeSearch.oninput = (e)=>{ S.tmp.q = e.target.value; render(); };
    const listSearch = document.getElementById('listSearch'); if (listSearch) listSearch.oninput = (e)=>{ S.tmp.listQ = e.target.value; render(); };

    const orderBtn = document.getElementById('orderBtn'); if (orderBtn) orderBtn.onclick = submitOrder;
    app.querySelectorAll('[data-order-filter]').forEach(el=>el.onclick=()=>{ S.tmp.orderFilter = el.dataset.orderFilter; render(); });
    app.querySelectorAll('[data-reorder]').forEach(el=>el.onclick=()=>{
      const o = S.tmp.orderDetail; if (!o) return;
      (o.items||[]).forEach(it=>{ if (S.products.find(p=>p.id===it.id)) S.cart[it.id]=(S.cart[it.id]||0)+it.miqdor; });
      toast(tr('toast_added_to_cart')); switchTab('cart');
    });
    const printBtn = app.querySelector('[data-print]'); if (printBtn) printBtn.onclick = async ()=>{
      const o = S.tmp.orderDetail; if (!o) return;
      toast(tr('toast_pdf_sending'));
      try{ await api('/api/order-pdf?id='+o.id); toast(tr('toast_pdf_sent')); } catch(e){ toast(e.message); }
    };

    const createObjBtn = document.getElementById('createObjBtn'); if (createObjBtn) createObjBtn.onclick = submitNewObject;
    const saveObjBtn = document.getElementById('saveObjBtn'); if (saveObjBtn) saveObjBtn.onclick = ()=>saveObjectEdit(top().params.id);
    const objSearch = document.getElementById('objSearch'); if (objSearch) objSearch.oninput = (e)=>{ S.tmp.objQ = e.target.value; render(); };
    const saveProfileBtn = document.getElementById('saveProfileBtn'); if (saveProfileBtn) saveProfileBtn.onclick = saveProfile;
    app.querySelectorAll('[data-toggle]').forEach(el=>el.onchange=()=>toggleNotifPref(el.dataset.toggle, el.checked));
    const themeSel = app.querySelector('[data-set-theme]'); if (themeSel) themeSel.onchange = ()=>setTheme(themeSel.value);
    const langSel = app.querySelector('[data-set-lang]'); if (langSel) langSel.onchange = ()=>setLang(langSel.value);
    const closeBtn = app.querySelector('[data-close-app]'); if (closeBtn) closeBtn.onclick = ()=>{ if (tg) tg.close(); else toast(tr('toast_close_in_telegram')); };

    const addAddrBtn = document.getElementById('addAddressBtn'); if (addAddrBtn) addAddrBtn.onclick = async ()=>{
      const nomi = document.getElementById('ad_nomi').value.trim(); const manzil = document.getElementById('ad_manzil').value.trim();
      if (!nomi || !manzil) { toast(tr('toast_fill_both_fields')); return; }
      try{ await api('/api/addresses', { method:'POST', body: JSON.stringify({ nomi, manzil }) }); S.tmp.addresses=null; render(); } catch(e){ toast(e.message); }
    };
    app.querySelectorAll('[data-del-address]').forEach(el=>el.onclick=async()=>{
      try{ await api('/api/addresses?id='+el.dataset.delAddress, { method:'DELETE' }); S.tmp.addresses=null; render(); } catch(e){ toast(e.message); }
    });

    app.querySelectorAll('[data-faq]').forEach(el=>el.onclick=()=>el.classList.toggle('open'));
    const sendOpBtn = document.getElementById('sendOpBtn'); if (sendOpBtn) sendOpBtn.onclick = sendOperatorMsg;

    app.querySelectorAll('[data-read-notif]').forEach(el=>el.onclick=async()=>{
      const id = el.dataset.readNotif;
      const n = S.notifications.find(x=>x.id===id);
      if (n && !n.oqilgan){ n.oqilgan = true; render(); try{ await api('/api/notifications', { method:'PATCH', body: JSON.stringify({ id }) }); }catch(e){} }
    });
    const markAll = app.querySelector('[data-mark-all-read]'); if (markAll) markAll.onclick = async ()=>{
      S.notifications.forEach(n=>n.oqilgan=true); render();
      try{ await api('/api/notifications', { method:'PATCH', body: JSON.stringify({ mark_all:true }) }); }catch(e){}
    };
  }

  boot();
})();
</script>
</body>
</html>
