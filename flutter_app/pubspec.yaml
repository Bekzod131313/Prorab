name: app
description: Moliya - loyiha va jamoa moliyasi platformasi
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  google_fonts: ^6.2.1
  intl: any
  http: ^1.2.0
  shared_preferences: ^2.2.0
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  package_info_plus: any
  cached_network_image: ^3.3.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  local_auth: ^2.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#f1f5f9"
  image: "assets/logo.png"
  color_dark: "#f1f5f9"
  image_dark: "assets/logo.png"
  android_12:
    image: "assets/logo.png"
    icon_background_color: "#f1f5f9"
    image_dark: "assets/logo.png"
    icon_background_color_dark: "#f1f5f9"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/
